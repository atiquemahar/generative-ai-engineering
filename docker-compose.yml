# docker-compose.yml
# Day 46 — Dockerize: Operations Agent API
#
# Usage:
#   docker compose up --build          # first run (builds image + starts)
#   docker compose up                  # subsequent runs
#   docker compose down                # stop and remove containers
#   docker compose down -v             # also remove the SQLite volume
#   docker compose logs -f             # tail logs
#
# Environment variables:
#   All Azure credentials live in a .env file at the repo root.
#   docker-compose passes every key from .env into the container.
#   Do NOT commit .env to version control.
#
# Required .env keys:
#   AZURE_OPENAI_API_KEY
#   AZURE_OPENAI_ENDPOINT
#   MODEL_DEPLOYMENT_NAME
#   AZURE_SEARCH_ENDPOINT
#   AZURE_SEARCH_API_KEY
#   AZURE_EMBEDDING_DEPLOYMENT
#   AZURE_PROJECT_ENDPOINT         (optional — for Foundry tracing)
#   APPLICATIONINSIGHTS_CONNECTION_STRING  (optional — for Azure Monitor)

services:
  operations-agent:
    build: 
      context:    # monorepo root — needed for absolute imports
      dockerfile: Dockerfile
      target: Production
    image:operations-agent: latest
    container_name: operations_agent
    ports:
      - "8000:8000"   # host:container
    volumes:
      - ops_db:/app/data    # persist SQLite across restarts
    env_file:
      - .env    # Azure credentials — never committed
    enviroment:
      - DATABASE_URL=sqlite:////app/data/operations_agent.db
      - PYTHONPATH=/app 
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"] 
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s     # give uvicorn time to boot before first check

# Named volume so the SQLite DB survives container restarts and rebuilds.
# To wipe the DB: docker compose down -v
volumes:
  ops_db:
    driver: local


